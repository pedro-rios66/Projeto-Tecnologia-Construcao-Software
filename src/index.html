<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymLog — Seu diário de treinos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="cabecalho-app">
    <div class="cabecalho-app__interno">
      <h1 class="cabecalho-app__titulo">GymLog</h1>
      <p class="cabecalho-app__subtitulo">Seu diário de treinos</p>
    </div>
  </header>

  <main id="app" class="principal-app">
    <!-- O conteúdo é renderizado dinamicamente pelo app.js, de acordo com a tela atual -->

    <section id="tela-treinos" class="tela" hidden>
      <div class="cabecalho-view">
        <h2>Meus Treinos</h2>
        <button id="btn-novo-treino" class="btn btn--primario" type="button">+ Novo Treino</button>
      </div>
      <div id="lista-treinos" class="grade-cartoes"></div>
    </section>

    <section id="tela-novo-treino" class="tela" hidden>
      <div class="cabecalho-view">
        <h2>Novo treino</h2>
      </div>
      <form id="form-novo-treino" class="formulario" novalidate>
        <div class="campo-formulario">
          <label for="input-nome-treino">Nome</label>
          <input id="input-nome-treino" name="nome" type="text" placeholder="Ex: Treino A" autocomplete="off">
        </div>
        <div class="campo-formulario">
          <label for="input-descricao-treino">Descrição</label>
          <input id="input-descricao-treino" name="descricao" type="text" placeholder="Ex: Peito + Tríceps (opcional)" autocomplete="off">
        </div>
        <p id="erro-novo-treino" class="erro-formulario" hidden></p>
        <div class="acoes-formulario">
          <button type="button" id="btn-cancelar-novo-treino" class="btn btn--secundario">Cancelar</button>
          <button type="submit" class="btn btn--primario">Criar treino</button>
        </div>
      </form>
    </section>

    <section id="tela-treino" class="tela" hidden>
      <button id="btn-voltar-treinos" class="btn-link" type="button">&larr; Voltar</button>
      <div class="cabecalho-view">
        <div>
          <h2 id="titulo-treino"></h2>
          <p id="descricao-treino" class="discreto"></p>
        </div>
      </div>
      <h3 class="subtitulo-secao">Exercícios</h3>
      <div id="lista-exercicios" class="grade-cartoes"></div>
      <button id="btn-novo-exercicio" class="btn btn--primario" type="button">+ Adicionar exercício</button>

      <div id="wrapper-form-novo-exercicio" class="wrapper-formulario" hidden>
        <form id="form-novo-exercicio" class="formulario" novalidate>
          <div class="campo-formulario">
            <label for="input-nome-exercicio">Nome do exercício</label>
            <input id="input-nome-exercicio" name="nome" type="text" placeholder="Ex: Supino Reto" autocomplete="off">
          </div>
          <p id="erro-novo-exercicio" class="erro-formulario" hidden></p>
          <div class="acoes-formulario">
            <button type="button" id="btn-cancelar-novo-exercicio" class="btn btn--secundario">Cancelar</button>
            <button type="submit" class="btn btn--primario">Adicionar</button>
          </div>
        </form>
      </div>
    </section>

    <section id="tela-exercicio" class="tela" hidden>
      <button id="btn-voltar-treino" class="btn-link" type="button">&larr; Voltar</button>
      <div class="cabecalho-view">
        <h2 id="titulo-exercicio"></h2>
      </div>
      <h3 class="subtitulo-secao">Séries</h3>
      <p id="progresso-series" class="progresso-series"></p>
      <table class="tabela-series">
        <thead>
          <tr>
            <th scope="col">Feito</th>
            <th scope="col">Série</th>
            <th scope="col">Peso</th>
            <th scope="col">Reps</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela-series"></tbody>
      </table>
      <button id="btn-nova-serie" class="btn btn--primario" type="button">+ Adicionar série</button>

      <div id="wrapper-form-nova-serie" class="wrapper-formulario" hidden>
        <form id="form-nova-serie" class="formulario" novalidate>
          <div class="campo-formulario">
            <label for="input-peso-serie">Peso (kg)</label>
            <input id="input-peso-serie" name="peso" type="number" step="0.5" min="0" placeholder="Ex: 60">
          </div>
          <div class="campo-formulario">
            <label for="input-repeticoes-serie">Repetições</label>
            <input id="input-repeticoes-serie" name="repeticoes" type="number" step="1" min="0" placeholder="Ex: 10">
          </div>
          <p id="erro-nova-serie" class="erro-formulario" hidden></p>
          <div class="acoes-formulario">
            <button type="button" id="btn-cancelar-nova-serie" class="btn btn--secundario">Cancelar</button>
            <button type="submit" class="btn btn--primario">Adicionar</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="rodape-app">
    <p>GymLog — Projeto acadêmico de Tecnologia de Construção de Software I</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
